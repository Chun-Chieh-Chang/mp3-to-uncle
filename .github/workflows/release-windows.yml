name: Build & Release Windows Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) to publish a GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch portable FFmpeg
        run: python downloader.py

      - name: Build AudioStudio.exe
        run: |
          python -m PyInstaller --onefile --noconsole --name="AudioStudio" --collect-all yt_dlp_ejs --add-data "templates;templates" --add-data "static;static" --add-data "bin;bin" app.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/AudioStudio.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AudioStudio.exe" | Out-File -FilePath dist/AudioStudio.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudio-Windows-Portable
          path: |
            dist/AudioStudio.exe
            dist/AudioStudio.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: AudioStudio ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/AudioStudio.exe
            dist/AudioStudio.exe.sha256
          generate_release_notes: true
