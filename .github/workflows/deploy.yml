name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Static Files
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          RELEASES_URL: https://github.com/${{ github.repository }}/releases/latest
        run: |
          mkdir -p public
          cp -r static public/
          cp templates/index.html public/index.html
          mv public/static/sw.js public/sw.js
          cp public/static/icons/icon-512.png public/favicon.ico
          touch public/.nojekyll
          sed -i "s|{{ url_for('static', filename='|static/|g" public/index.html
          sed -i "s|') }}||g" public/index.html
          if grep -q '{{' public/index.html; then
            echo "Error: Unresolved Jinja template tags found in public/index.html"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          cfg = {
              "apiBaseUrl": os.environ.get("API_BASE_URL", "").strip().rstrip("/"),
              "releasesUrl": os.environ["RELEASES_URL"],
          }
          with open("public/static/js/config.js", "w", encoding="utf-8") as f:
              f.write("window.AUDIOSTUDIO_CONFIG = " + json.dumps(cfg, ensure_ascii=False, indent=4) + ";\n")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
